<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picolé 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
    model-viewer { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <model-viewer
    src="https://cdn.jsdelivr.net/gh/thiagomanauara-ops/portfolio@main/Picole_3d/scene.gltf"
    alt="Modelo 3D Picolé"
    loading="eager"
    camera-controls
    auto-rotate
    shadow-intensity="1.2"
    exposure="1">
  </model-viewer>
</body>
</html>
